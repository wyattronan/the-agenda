# The site is prebuilt by build.sh and committed in site/. Netlify only adds the per-tab pages
# (site/senate/index.html and so on) from the committed index.html; pages.py needs nothing but python3.
[build]
  publish = "site"
  command = "python3 pages.py"

# Site forms (Glossary "request a definition" and the About contact form) file GitHub issues through
# netlify/functions/glossary-request.js (needs GITHUB_TOKEN set in Netlify; contact needs the repo private)
[functions]
  directory = "netlify/functions"
